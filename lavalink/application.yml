server:
  port: 2333
  address: 0.0.0.0
  password: "${LAVALINK_PASSWORD:youshallnotpass}"
  sources:
    youtube: false
    bandcamp: true
    soundcloud: true
    http: true
    local: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.5"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      snapshot: false

plugins:
  lavasrc:
    sources:
      spotify: true
      deezer: true
      applemusic: false
      youtube: false
      yandexmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false

    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"

    deezer:
      arl: "${DEEZER_ARL}"

  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - ANDROID_VR
      - WEB
      - MUSIC
